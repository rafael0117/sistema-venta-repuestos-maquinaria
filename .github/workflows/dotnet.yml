name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SistemaRepuestosMaquinas.sln
      - name: Build
        run: dotnet build SistemaRepuestosMaquinas.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test SistemaRepuestosMaquinas.sln --configuration Release --no-build
