services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: srm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sql_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: srm-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RSISTEMADB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      Jwt__Issuer: "SistemaRepuestosMaquinas.API"
      Jwt__Audience: "SistemaRepuestosMaquinas.Web"
      Jwt__SecretKey: "CAMBIA_ESTA_LLAVE_POR_UNA_SEGURA_DE_32+"
      Jwt__ExpirationMinutes: "120"
      MercadoPago__PublicKey: "REEMPLAZAR"
      MercadoPago__AccessToken: "REEMPLAZAR"
      MercadoPago__WebAppBaseUrl: "http://localhost:8082"
      PasswordRecovery__SmtpHost: "smtp.gmail.com"
      PasswordRecovery__SmtpPort: "587"
      PasswordRecovery__SmtpUser: "REEMPLAZAR"
      PasswordRecovery__SmtpPassword: "REEMPLAZAR"
      PasswordRecovery__FromEmail: "REEMPLAZAR"
      PasswordRecovery__FrontendResetUrl: "http://localhost:8082/Cuenta/RestablecerContrasena"
      PasswordRecovery__UseSsl: "true"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: srm-web
    depends_on:
      - api
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: "http://api:8080/"
      MercadoPago__PublicKey: "REEMPLAZAR"

volumes:
  sql_data:
